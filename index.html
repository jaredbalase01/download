<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balase Compiler - Download</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        background: #0d1117;
        color: #c9d1d9;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
   .card {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 24px;
        padding: 2rem;
        width: 100%;
        max-width: 560px;
        text-align: center;
        box-shadow: 0 0 20px rgba(88,166,255,0.1);
    }
    h1 { color: #58a6ff; font-size: 2.2rem; margin-bottom: 8px; }
    p { color: #8b949e; margin-bottom: 20px; }
   .downloads {
        font-size: 1.3rem;
        margin: 20px 0;
        background: #0d1117;
        padding: 12px 20px;
        border-radius: 20px;
        display: inline-block;
        border: 1px solid #30363d;
    }
   .downloads b { color: #58a6ff; font-size: 1.5rem; }
   .btn {
        display: block;
        width: 100%;
        padding: 16px;
        background: #238636;
        color: white;
        text-decoration: none;
        border-radius: 60px;
        font-weight: 700;
        font-size: 1.3rem;
        margin-top: 10px;
        transition: 0.2s;
    }
   .btn:hover { background: #2ea043; transform: scale(1.02); }
    #status { font-size: 12px; color: #8b949e; margin-top: 10px; min-height: 18px;}
</style>
</head>
<body>
<div class="card">
    <h1>⚡ Balase Compiler ⚡</h1>
    <p>Arduino Programming gamit ang sariling Wikang Filipino</p>

    <div class="downloads">📥 Total Downloads: <b id="count">Loading...</b></div>

    <a class="btn" id="downloadBtn" href="https://github.com/jaredbalase01/download/releases/latest/download/A.zip">⬇ Download Balase_ACP.apk</a>

    <div id="status">Kinukuha ang bilang mula sa Github...</div>
</div>

<script>
(function() {
    var countEl = document.getElementById('count');
    var statusEl = document.getElementById('status');

    function formatNumber(num) {
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    // KUKUHA NG DOWNLOAD COUNT GALING SA GITHUB RELEASES API
    // HINDI ITO BINABLOCK KAHIT SA J1 AT BRAVE
    function getGithubCount() {
        var url = 'https://api.github.com/repos/jaredbalase01/download/releases/latest';
        var callbackName = 'gh_cb_' + new Date().getTime();

        window[callbackName] = function(response) {
            var data = response.data || response; // para sa JSONP at direct
            var totalDownloads = 0;

            if(data.assets && data.assets.length > 0) {
                // Hanapin yung Balase_ACP.apk at kunin download_count
                for(var i = 0; i < data.assets.length; i++) {
                    if(data.assets[i].name === 'A.zip') {
                        totalDownloads = data.assets[i].download_count;
                        break;
                    }
                }
            }

            countEl.innerText = formatNumber(totalDownloads);
            statusEl.innerText = '✅ Updated: ' + new Date().toLocaleDateString('en-PH');

            // Linis
            var script = document.getElementById(callbackName);
            if(script) document.head.removeChild(script);
            delete window[callbackName];
        };

        var script = document.createElement('script');
        script.id = callbackName;
        script.src = url + '?callback=' + callbackName;
        script.onerror = function() {
            countEl.innerText = 'N/A';
            statusEl.innerText = '⚠️ Offline o walang release pa';
        };
        document.head.appendChild(script);
    }

    // Load pag open
    getGithubCount();
})();
</script>
</body>
</html>
