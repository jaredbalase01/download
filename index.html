<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balase Compiler - Download</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        background: #0d1117;
        color: #c9d1d9;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
  .card {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 24px;
        padding: 2rem;
        width: 100%;
        max-width: 560px;
        text-align: center;
    }
    h1 { color: #58a6ff; font-size: 2.2rem; margin-bottom: 8px; }
    p { color: #8b949e; margin-bottom: 20px; }
  .downloads { font-size: 1.3rem; margin: 20px 0; background: #0d1117; padding: 12px 20px; border-radius: 20px; display: inline-block; }
  .downloads b { color: #58a6ff; font-size: 1.5rem; }
  .btn { display: block; width: 100%; padding: 16px; background: red; color: white; text-decoration: none; border-radius: 60px; font-weight: 700; font-size: 1.3rem; margin-top: 10px; }
  .btn:hover { background: #2ea043; }
    #status { font-size: 12px; color: #8b949e; margin-top: 10px; min-height: 18px;}
</style>
</head>
<body>
<div class="card">
    <h1>⚡ Balase Compiler ⚡</h1>
    <p>Arduino Programming gamit ang sariling Wikang Filipino</p>

    <div class="downloads">📥 Total Downloads: <b id="count">0</b></div>

    <a class="btn" href="https://github.com/jaredbalase01/download/releases/latest/download/Liza.jpg">⬇ Download A.zip</a>

    <div id="status">Kinukuha ang bilang...</div>
</div>

<script>
// KUKUHA NG TOTOONG DOWNLOAD COUNT GALING SA GITHUB
(function() {
    var countEl = document.getElementById('count');
    var statusEl = document.getElementById('status');
    var FILE = 'Liza.jpg'; // Pangalan ng file mo sa Release

    function formatNumber(n) { return n.toLocaleString(); }

    var url = 'https://api.github.com/repos/jaredbalase01/download/releases/latest';
    var cb = 'cb' + Date.now();

    window[cb] = function(res) {
        var data = res.data || res;
        var downloads = 0;
        if(data.assets) {
            for(var i=0; i<data.assets.length; i++) {
                if(data.assets[i].name === FILE) {
                    downloads = data.assets[i].download_count;
                    break;
                }
            }
        }
        countEl.innerText = formatNumber(downloads);
        statusEl.innerText = '✅ Real count from Github';
    };

    var s = document.createElement('script');
    s.src = url + '?callback=' + cb;
    s.onerror = function(){ statusEl.innerText = '⚠️ Hindi makuha ang count'; };
    document.head.appendChild(s);
})();
</script>
</body>
</html>
