<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balase Compiler - Download</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
   .card { background: #161b22; border: 1px solid #30363d; border-radius: 24px; padding: 2rem; width: 100%; max-width: 560px; text-align: center; }
    h1 { color: #58a6ff; font-size: 2.2rem; margin-bottom: 10px; }
   .downloads { font-size: 1.3rem; margin: 20px 0; background: #0d1117; padding: 10px; border-radius: 20px; display: inline-block; }
   .downloads b { color: #58a6ff; }
   .btn { display: block; width: 100%; padding: 16px; background: #1f6feb; color: white; text-decoration: none; border-radius: 60px; font-weight: 700; font-size: 1.3rem; margin-top: 10px; }
   .btn:hover { background: #388bfd; }
    #status { font-size: 12px; color: #3fb950; margin-top: 10px; min-height: 20px;}
</style>
</head>
<body>
<div class="card">
    <h1>⚡ Balase Compiler ⚡</h1>
    <p>Arduino Programming gamit sariling Wikang Filipino</p>
    <div class="downloads">📥 Total Downloads: <b id="count">0</b></div>

    <a class="btn" id="downloadBtn" href="Balase_ACP.apk" download>⬇ Download Balase_ACP.apk</a>

    <div id="status"></div>
</div>

<script>
var COUNTER_KEY = 'balase-acp-jared-global'; // ITO YUNG ISANG NUMBER PARA SA LAHAT
var countEl = document.getElementById('count');
var downloadBtn = document.getElementById('downloadBtn');
var statusEl = document.getElementById('status');

function formatNumber(num) {
    return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

// FUNCTION PARA KUMUHA NG COUNT GAMIT SCRIPT TAG - GUMAGANA SA J1
function getCount(increment, callback) {
    var action = increment? 'hit' : 'get';
    var url = 'https://api.countapi.xyz/' + action + '/' + COUNTER_KEY + '?callback=cb' + new Date().getTime();

    var script = document.createElement('script');
    script.src = url;

    window[script.src.split('callback=')[1]] = function(data) {
        countEl.innerText = formatNumber(data.value);
        if(callback) callback(data.value);
        document.head.removeChild(script);
        delete window[script.src.split('callback=')[1]];
    };

    script.onerror = function() {
        statusEl.innerText = '⚠️ Offline. Count may not be accurate.';
        document.head.removeChild(script);
    };

    document.head.appendChild(script);
}

// 1. KUHA NG COUNT PAG OPEN
getCount(false);

// 2. PAG CLICK - +1 TAPOS DOWNLOAD
downloadBtn.onclick = function() {
    // +1 muna sa counter
    getCount(true, function(newCount){
        statusEl.innerText = '✅ Downloaded! Total: ' + formatNumber(newCount);
        setTimeout(function(){statusEl.innerText = '';}, 3000);
    });

    // Hayaan mo yung default na download kasi may href na
};
</script>
</body>
</html>
