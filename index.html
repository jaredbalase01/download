<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Balase Compiler - Download</title>
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    /* ----- CARD – fluid width, perfect on phone & desktop ----- */
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 24px;
      padding: 2rem 1.8rem;
      width: 100%;
      max-width: 560px;          /* comfortable max on desktop */
      margin: 0 auto;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      transition: padding 0.2s ease;
    }

    /* ----- TYPOGRAPHY & SPACING (responsive) ----- */
    h1 {
      color: #58a6ff;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      letter-spacing: 1px;
      margin-bottom: 0.25rem;
      font-weight: 700;
      word-break: break-word;
    }

    .sub-headline {
      font-size: clamp(1rem, 3vw, 1.2rem);
      color: #8b949e;
      margin-bottom: 1.5rem;
      border-bottom: 1px dashed #30363d;
      padding-bottom: 0.75rem;
    }

    .version {
      background: #238636;
      padding: 0.4rem 1.4rem;
      border-radius: 40px;
      display: inline-block;
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      font-weight: 600;
      color: white;
      letter-spacing: 0.3px;
      margin: 0.5rem 0 1.2rem 0;
    }

    .downloads {
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      margin: 1.2rem 0 1.8rem 0;
      background: #0d1117;
      padding: 0.6rem 1rem;
      border-radius: 40px;
      display: inline-block;
      border: 1px solid #30363d;
    }

    .downloads b {
      color: #f0f6fc;
      background: #1f6feb33;
      padding: 0.1rem 0.7rem;
      border-radius: 30px;
      margin-left: 4px;
    }

    /* ----- BUTTON – touch-friendly, wide, responsive ----- */
    .btn {
      display: inline-block;
      width: 100%;
      max-width: 320px;
      padding: 1rem 1.2rem;
      background: #1f6feb;
      color: white;
      text-decoration: none;
      border-radius: 60px;
      font-weight: 700;
      font-size: clamp(1.2rem, 4vw, 1.5rem);
      letter-spacing: 0.5px;
      transition: background 0.2s, transform 0.1s ease, box-shadow 0.2s;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 0 #0f4a9e;
      text-align: center;
      margin: 0.5rem auto 0.2rem auto;
    }

    .btn:hover {
      background: #2b7af0;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #0f4a9e;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0f4a9e;
    }

    /* ----- small extra spacing & helper ----- */
    .card p {
      margin: 0.4rem 0;
    }

    .footer-note {
      margin-top: 1.6rem;
      font-size: 0.85rem;
      color: #6e7681;
      border-top: 1px solid #21262d;
      padding-top: 1.2rem;
      letter-spacing: 0.3px;
    }

    /* ----- phone-first: extra breathing for tiny screens ----- */
    @media (max-width: 480px) {
      .card {
        padding: 1.6rem 1.2rem;
        border-radius: 20px;
      }
      .btn {
        max-width: 100%;
        padding: 0.9rem 1rem;
      }
      .downloads {
        padding: 0.4rem 0.8rem;
      }
    }

    /* optional: desktop fine-tune */
    @media (min-width: 768px) {
      .card {
        padding: 2.8rem 2.5rem;
      }
      .btn {
        max-width: 340px;
      }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>⚡ Balase Compiler ⚡</h1>
  <p class="sub-headline">Arduino Programming gamit sariling Wikang Filipino</p>

  <div class="version">Version: <b>1.0</b></div>

  <div class="downloads">📥 Total Downloads: <b id="count">Loading...</b></div>

  <a href="img.jpg" class="btn" id="downloadBtn" download>
    ⬇ Download APK
  </a>

  <div class="footer-note">✨ responsive • open source • filipino</div>
</div>

<script>
(function() { 
    const counterKey = 'balase_compiler_v1'; 
    const countEl = document.getElementById('count');
    const downloadBtn = document.getElementById('downloadBtn');

    function formatNumber(num) { 
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); 
    }

    // --- 1. KUNIN ANG COUNT. PAG WALA, GAWA AGAD NG 0 ---
    fetch(`https://api.countapi.xyz/hit/${counterKey}?amount=0`) // amount=0 para hindi mag+1
    .then(res => res.json())
    .then(data => { 
        countEl.innerText = formatNumber(data.value); 
    })
    .catch(() => { 
        countEl.innerText = '0'; 
    });

    // --- 2. PAG CLICK, +1 TALAGA ---
    downloadBtn.addEventListener('click', function(e) { 
        fetch(`https://api.countapi.xyz/hit/${counterKey}`) // default +1 to
        .then(res => res.json())
        .then(data => { 
            countEl.innerText = formatNumber(data.value); 
        })
        .catch(() => { 
            // kung pumalya, re-fetch na lang
            fetch(`https://api.countapi.xyz/hit/${counterKey}?amount=0`)
            .then(res => res.json()).then(data => countEl.innerText = formatNumber(data.value))
        });
    }); 
})();
</script>
</body>
</html>
